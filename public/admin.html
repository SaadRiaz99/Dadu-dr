<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Prof. Dr. Javed Iqbal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav container">
      <a href="index.html" class="logo">Prof. Dr. Javed Iqbal</a>
      <div class="nav-right">
        <a href="index.html" class="nav-link">View Patient Site</a>
        <button id="logoutBtn" class="btn btn-outline btn-nav hidden">Logout</button>
      </div>
    </nav>
  </header>

  <main>
    <!-- LOGIN -->
    <section id="loginView" class="section">
      <div class="container login-box">
        <h1>Admin Login</h1>
        <p class="muted-note">Enter the admin password to manage appointments.</p>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Admin password">
        <button type="button" id="loginBtn" class="btn btn-primary btn-block">Login</button>
        <p id="loginMsg" class="form-msg" role="status"></p>
      </div>
    </section>

    <!-- DASHBOARD -->
    <section id="dashView" class="section hidden admin-dash">
      <div class="container">
        <div class="dash-head">
          <h1>Manage Appointments</h1>
          <button type="button" id="refreshBtn" class="btn btn-outline">Refresh List</button>
        </div>

        <div class="stats-grid" id="statsGrid"></div>

        <div class="quick-filters" id="quickFilters">
          <button type="button" class="qf-btn qf-active" data-filter="">All</button>
          <button type="button" class="qf-btn" data-filter="today">Today</button>
          <button type="button" class="qf-btn" data-filter="Pending">New Requests</button>
          <button type="button" class="qf-btn" data-filter="Confirmed">Confirmed</button>
          <button type="button" class="qf-btn" data-filter="Completed">Completed</button>
          <button type="button" class="qf-btn" data-filter="Cancelled">Cancelled</button>
        </div>

        <p class="muted-note list-hint" id="listHint"></p>

        <div class="table-wrap">
          <table class="appt-table">
            <thead>
              <tr>
                <th>When</th>
                <th>Patient</th>
                <th>Service</th>
                <th>Payment</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="apptBody">
              <tr><td colspan="6" class="muted-note">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; Prof. Dr. Javed Iqbal. Admin area.</p>
    </div>
  </footer>

  <script>
    let token = localStorage.getItem('admin_token') || '';

    const loginView = document.getElementById('loginView');
    const dashView = document.getElementById('dashView');
    const loginMsg = document.getElementById('loginMsg');
    const logoutBtn = document.getElementById('logoutBtn');

    function showLogin() {
      loginView.classList.remove('hidden');
      dashView.classList.add('hidden');
      logoutBtn.classList.add('hidden');
    }

    function showDash() {
      loginView.classList.add('hidden');
      dashView.classList.remove('hidden');
      logoutBtn.classList.remove('hidden');
      loadDashboard();
    }

    async function loadDashboard() {
      await Promise.all([loadStats(), loadAppointments()]);
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/admin/stats', { headers: { Authorization: 'Bearer ' + token } });
        if (res.status === 401) return handleUnauthorized();
        const s = await res.json();
        const cards = [
          { label: 'Total', value: s.total },
          { label: "Today's", value: s.today },
          { label: 'New Requests', value: s.pending },
          { label: 'Collected', value: 'Rs ' + (s.revenue || 0) }
        ];
        document.getElementById('statsGrid').innerHTML = cards.map((c) =>
          '<div class="stat-card"><span>' + c.label + '</span><strong>' + c.value + '</strong></div>'
        ).join('');
      } catch (e) { /* ignore */ }
    }

    let allAppointments = [];

    async function loadAppointments() {
      try {
        const res = await fetch('/api/admin/appointments', { headers: { Authorization: 'Bearer ' + token } });
        if (res.status === 401) return handleUnauthorized();
        const data = await res.json();
        allAppointments = data.appointments;
        renderRows();
      } catch (e) {
        document.getElementById('apptBody').innerHTML = '<tr><td colspan="6" class="muted-note">Could not load appointments.</td></tr>';
      }
    }

    function currentFilter() {
      const active = document.querySelector('.qf-btn.qf-active');
      return active ? active.dataset.filter : '';
    }

    function todayStr() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function filteredRows() {
      const filter = currentFilter();
      if (!filter) return allAppointments;
      if (filter === 'today') return allAppointments.filter((a) => a.date === todayStr());
      return allAppointments.filter((a) => a.status === filter);
    }

    function renderRows() {
      const tbody = document.getElementById('apptBody');
      const rows = filteredRows().slice().sort((x, y) => {
        if (x.date !== y.date) return x.date < y.date ? -1 : 1;
        return (x.time || '00:00').localeCompare(y.time || '00:00');
      });

      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="muted-note">No appointments here.</td></tr>';
        return;
      }

      tbody.innerHTML = rows.map((a) => {
        const time12 = to12(a.time);
        const status = a.status || 'Pending';
        const paid = a.payment_status === 'Paid';

        const confirmBtn = status === 'Pending'
          ? '<button type="button" class="act-btn act-confirm" data-act="Confirmed" data-id="' + a.id + '">Confirm</button>' : '';
        const doneBtn = status === 'Confirmed'
          ? '<button type="button" class="act-btn act-done" data-act="Completed" data-id="' + a.id + '">Mark Done</button>' : '';
        const cancelBtn = (status === 'Pending' || status === 'Confirmed')
          ? '<button type="button" class="act-btn act-cancel" data-act="Cancelled" data-id="' + a.id + '">Cancel</button>' : '';
        const payBtn = '<button type="button" class="pay-btn' + (paid ? ' is-paid' : '') + '" data-pay="' + a.id + '">' + (paid ? 'Paid' : 'Mark Paid') + '</button>';

        return '<tr>' +
          '<td><span class="token-badge">#' + (a.serial || '—') + '</span><strong>' + esc(a.date) + '</strong><span class="cell-sub">' + time12 + '</span></td>' +
          '<td><strong>' + esc(a.name) + '</strong><span class="cell-sub">' + esc(a.phone) + '</span><span class="cell-sub">' + esc(a.email) + '</span></td>' +
          '<td><strong>' + esc(a.service || 'ENT Consultation') + '</strong><span class="cell-sub">' + esc(a.charge || '—') + '</span></td>' +
          '<td><strong>' + esc(a.payment_method || 'Cash at Clinic') + '</strong><span class="cell-sub">' + (paid ? 'Paid' : 'Not paid yet') + '</span></td>' +
          '<td><span class="status-pill status-' + status.toLowerCase() + '">' + esc(status) + '</span></td>' +
          '<td class="actions-cell">' +
            '<div class="row-actions">' + confirmBtn + doneBtn + cancelBtn + '</div>' +
            '<div class="row-actions pay">' + payBtn + '<button type="button" class="act-btn act-del" data-del="' + a.id + '">Delete</button></div>' +
          '</td>' +
        '</tr>';
      }).join('');

      document.getElementById('listHint').textContent = rows.length + ' appointment' + (rows.length === 1 ? '' : 's') + ' shown.';
    }

    async function setStatus(id, status) {
      await fetch('/api/admin/appointments/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ status })
      });
      loadDashboard();
    }

    async function togglePayment(id) {
      const a = allAppointments.find((x) => String(x.id) === String(id));
      const next = a && a.payment_status === 'Paid' ? 'Unpaid' : 'Paid';
      await fetch('/api/admin/appointments/' + id + '/payment', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ payment_status: next })
      });
      loadDashboard();
    }

    async function deleteAppt(id) {
      if (!confirm('Delete this appointment permanently?')) return;
      await fetch('/api/admin/appointments/' + id, {
        method: 'DELETE',
        headers: { Authorization: 'Bearer ' + token }
      });
      loadDashboard();
    }

    document.getElementById('apptBody').addEventListener('click', (e) => {
      const act = e.target.closest('[data-act]');
      if (act) return setStatus(act.dataset.id, act.dataset.act);
      const pay = e.target.closest('[data-pay]');
      if (pay) return togglePayment(pay.dataset.pay);
      const del = e.target.closest('[data-del]');
      if (del) return deleteAppt(del.dataset.del);
    });

    function handleUnauthorized() {
      localStorage.removeItem('admin_token');
      token = '';
      showLogin();
    }

    function to12(t) {
      const [h, m] = (t || '00:00').split(':').map(Number);
      const ampm = h >= 12 ? 'PM' : 'AM';
      const hr = h % 12 || 12;
      return hr + ':' + String(m).padStart(2, '0') + ' ' + ampm;
    }

    function esc(s) {
      const div = document.createElement('div');
      div.textContent = s == null ? '' : s;
      return div.innerHTML;
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const password = document.getElementById('password').value;
      loginMsg.textContent = 'Logging in...';
      loginMsg.className = 'form-msg';
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (!res.ok) {
          loginMsg.textContent = data.error || 'Login failed.';
          loginMsg.className = 'form-msg error';
          return;
        }
        token = data.token;
        localStorage.setItem('admin_token', token);
        document.getElementById('password').value = '';
        showDash();
      } catch (e) {
        loginMsg.textContent = 'Network error.';
        loginMsg.className = 'form-msg error';
      }
    });

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('admin_token');
      token = '';
      showLogin();
    });

    document.getElementById('quickFilters').addEventListener('click', (e) => {
      const btn = e.target.closest('.qf-btn');
      if (!btn) return;
      document.querySelectorAll('.qf-btn').forEach((b) => b.classList.remove('qf-active'));
      btn.classList.add('qf-active');
      renderRows();
    });

    document.getElementById('refreshBtn').addEventListener('click', loadDashboard);

    if (token) showDash();
    else showLogin();
  </script>
</body>
</html>
